# ==============================================================================
# Hooks locais (opcional, por máquina): bloqueia o commit se houver segredo no que
# está staged. Instalação: pipx install pre-commit && pre-commit install
# O mesmo .gitleaks.toml roda no CI (.github/workflows/security.yml).
# Ver docs/seguranca-deploy.md, "Varredura de segredos".
# ==============================================================================
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
